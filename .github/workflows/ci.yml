name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.1
      - name: Install locked test dependencies
        run: uv sync --locked --extra test --python "$(command -v python)"
      - name: Lint, format, and test
        run: |
          uv run --locked --extra test ruff check src tests
          uv run --locked --extra test ruff format --check src tests
          uv run --locked --extra test pytest -q -rs
      - name: Build wheel and source distribution
        run: uv build
